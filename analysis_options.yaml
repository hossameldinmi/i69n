include: package:lints/core.yaml

# For lint rules and documentation, see http://dart-lang.github.io/linter/lints.
# Uncomment to specify additional rules.
# linter:
#   rules:
#     - camel_case_types

analyzer:
  # Generated message bundles are machine-produced (they carry their own
  # ignore_for_file header) and are verified by the test suite, not the linter.
  exclude:
    - "**/*.i69n.dart"
    - "**/*.i69n.g.dart"

formatter:
  page_width: 120