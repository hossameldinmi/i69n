# Read about `build.yaml` at https://pub.dartlang.org/packages/build_config
builders:

  yamlBasedBuilder:
    import: "package:i69n/builder.dart"
    builder_factories: ["yamlBasedBuilder"]
    build_extensions: {".i69n.yaml": [".i69n.dart"]}
    build_to: source
    auto_apply: root_package

  jsonBasedBuilder:
    import: "package:i69n/builder.dart"
    builder_factories: ["jsonBasedBuilder"]
    build_extensions: {".i69n.json": [".i69n.dart"]}
    build_to: source
    auto_apply: root_package

  jsoncBasedBuilder:
    import: "package:i69n/builder.dart"
    builder_factories: ["jsoncBasedBuilder"]
    build_extensions: {".i69n.jsonc": [".i69n.dart"]}
    build_to: source
    auto_apply: root_package

# Test fixtures under test/ are parsed directly by the test suite, not built.
# Excluding them also avoids a yaml/json output collision for shared basenames.
targets:
  $default:
    builders:
      i69n|yamlBasedBuilder:
        generate_for:
          exclude:
            - test/**
      i69n|jsonBasedBuilder:
        generate_for:
          exclude:
            - test/**
      i69n|jsoncBasedBuilder:
        generate_for:
          exclude:
            - test/**

# Global nomap flag example
#       i69n|yamlBasedBuilder:
#         options:
#           nomap: true